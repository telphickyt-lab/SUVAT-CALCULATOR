<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SUVAT Calculator | A-Level Physics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=STIX+Two+Text:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <section class="hero">
      <p class="kicker">A-Level Physics</p>
      <h1>SUVAT Calculator</h1>
      <p class="intro">
        Enter the values you already know, then calculate the remaining quantities. The calculator will show each equation used and the full substitution steps.
      </p>
    </section>

    <section class="panel">
      <form id="suvat-form" class="form-grid" novalidate>
        <label>
          <span>Displacement, <strong>s</strong> (m)</span>
          <input type="number" step="any" name="s" placeholder="e.g. 120" />
        </label>
        <label>
          <span>Initial velocity, <strong>u</strong> (m/s)</span>
          <input type="number" step="any" name="u" placeholder="e.g. 5" />
        </label>
        <label>
          <span>Final velocity, <strong>v</strong> (m/s)</span>
          <input type="number" step="any" name="v" placeholder="e.g. 25" />
        </label>
        <label>
          <span>Acceleration, <strong>a</strong> (m/s²)</span>
          <input type="number" step="any" name="a" placeholder="e.g. 2" />
        </label>
        <label>
          <span>Time, <strong>t</strong> (s)</span>
          <input type="number" step="any" name="t" placeholder="e.g. 10" />
        </label>

        <div class="actions">
          <button type="submit">Calculate Unknowns</button>
          <button type="button" id="clear-btn" class="ghost">Clear</button>
        </div>
      </form>
    </section>

    <section class="panel" id="results" aria-live="polite">
      <h2>Results</h2>
      <div id="status" class="status muted">Fill in at least three values and press calculate.</div>
      <div id="solved-list" class="result-list"></div>
      <div id="possible-list" class="result-list"></div>
    </section>

    <section class="panel" id="working-panel">
      <h2>Working Out</h2>
      <div id="working-list" class="working-list muted">Your worked steps will appear here.</div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
